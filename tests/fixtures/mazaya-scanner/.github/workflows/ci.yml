name: PHP integration
on: [push]
jobs:
  php-test:
    runs-on: ubuntu-latest
    container: 'python:3.12'
    services:
      mysql:
        image: mysql:8.0.46
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, curl, gd, intl, zip, bcmath, mysql, pdo_mysql, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: docker pull mysql:8.0.46
      - run: docker build --tag fixture/backend:ci .
