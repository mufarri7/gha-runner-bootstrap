name: mazaya-scanner-fixture
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, curl, gd, intl, zip, bcmath, mysql, pdo_mysql, pcntl
          tools: composer:v2
      - run: docker pull mysql:8.0.46
      - run: docker run --rm redis:7-alpine redis-server --version
