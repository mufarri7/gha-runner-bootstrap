name: fixture
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: Xvfb :99 &
      - run: docker run --rm postgres:15-alpine postgres --version
      - run: yq --version
